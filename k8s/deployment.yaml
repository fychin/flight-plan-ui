apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-plan-ui
  namespace: default
  labels:
    app: flight-plan-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-plan-ui
  template:
    metadata:
      labels:
        app: flight-plan-ui
    spec:
      containers:
        - name: web
          image: __IMAGE_URI__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
