name: Build and Push Image

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment providing Artifact Registry and WIF settings
        required: true
        type: string
    outputs:
      image_uri:
        description: URI of the image pushed with this commit SHA tag
        value: ${{ jobs.build-and-push.outputs.image_uri }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image URI
        id: image
        run: |
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/flight-plan-ui:${GITHUB_SHA}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Building image: ${IMAGE_URI}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${GAR_REPOSITORY}" \
            --location="${GAR_LOCATION}" \
            --project="${PROJECT_ID}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "${GAR_REPOSITORY}" \
            --repository-format=docker \
            --location="${GAR_LOCATION}" \
            --project="${PROJECT_ID}" \
            --description="Docker images for flight-plan-ui"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
