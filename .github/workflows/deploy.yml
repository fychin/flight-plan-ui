name: Deploy to GKE

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy to
        required: true
        type: choice
        options:
          - dev
        default: dev

env:
  CLUSTER_LOCATION: asia-southeast1

jobs:
  build-image:
    name: Build and Push Image
    uses: ./.github/workflows/build-and-push-image.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  image-summary:
    name: Image URI Summary
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ needs.build-image.result == 'success' }}
    steps:
      - name: Write pushed image URI
        env:
          IMAGE_URI: ${{ needs.build-image.outputs.image_uri }}
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE_URI%%/*}"
          IMAGE_PATH="${IMAGE_URI#*/}"
          PROJECT_ID="${IMAGE_PATH%%/*}"
          REPOSITORY_IMAGE="${IMAGE_PATH#*/}"
          REPOSITORY="${REPOSITORY_IMAGE%%/*}"
          IMAGE_REF="${REPOSITORY_IMAGE#*/}"
          IMAGE_NAME="${IMAGE_REF%%:*}"
          IMAGE_TAG="${IMAGE_REF##*:}"

          {
            echo "## Image build result"
            echo
            echo "Image URI: \`${IMAGE_URI}\`"
            echo
            echo "| Status | Registry | Project | Repository | Image | Tag |"
            echo "| --- | --- | --- | --- | --- | --- |"
            echo "| ✅ Pushed | \`${REGISTRY}\` | \`${PROJECT_ID}\` | \`${REPOSITORY}\` | \`${IMAGE_NAME}\` | \`${IMAGE_TAG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GKE
    needs: [build-image, image-summary]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
      IMAGE_URI: ${{ needs.build-image.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin,kubectl

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      - name: Apply manifests
        run: |
          set -euo pipefail
          sed -i "s|__IMAGE_URI__|${IMAGE_URI}|g" k8s/deployment.yaml
          kubectl apply -f k8s/

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/flight-plan-ui \
            --namespace=default --timeout=180s

          kubectl get deployment,service,pods \
            --namespace=default \
            -l app=flight-plan-ui
